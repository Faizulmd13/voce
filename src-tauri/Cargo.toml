[package]
name = "voce"
version = "0.1.0"
description = "Voce - Local-First AI Desktop Application"
authors = ["Faizul <faizul@voce.ai>"]
edition = "2021"
default-run = "voce"

[lib]
name = "voce_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "voce"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
cpal = "0.15"
hound = "3.5"
enigo = "0.3"
arboard = "3.4"
rubato = "5.0.0"
reqwest = { version = "0.13.5", features = ["multipart", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dotenvy = "0.15"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
